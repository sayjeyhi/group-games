document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-content:center;\">\n            <svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-9 8.36L3 21l1.14-3.6A8.38 8.38 0 1 1 21 11.5z\"><\u002Fpath><path d=\"M8 10h8M8 13.5h5\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <div><h1 style=\"font-size:30px;font-weight:900;margin:0;\">جمله‌بافی<\u002Fh1><p style=\"margin:0;font-size:15px;color:#4f8a2e;\">یه داستان گروهی بساز<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border-radius:20px;padding:18px;box-shadow:0 4px 16px rgba(20,16,12,.05);margin-bottom:22px;\">\n          <div style=\"font-size:14px;font-weight:700;color:#4f8a2e;margin-bottom:14px;\">جمله‌ی شروع<\u002Fdiv>\n          <div style=\"background:#f1f8ec;border:2px dashed #b7d99a;border-radius:16px;padding:30px 22px;text-align:center;min-height:150px;display:flex;align-items:center;justify-content:center;\">\n            <div style=\"font-size:28px;font-weight:800;color:#14100c;line-height:1.7;\">{{ jSentence }}<\u002Fdiv>\n          <\u002Fdiv>\n          <button onclick=\"{{ jShuffle }}\" style=\"width:100%;margin-top:14px;border:none;background:#eef5e6;color:#4f8a2e;font-family:inherit;font-size:16px;font-weight:700;padding:13px;border-radius:14px;cursor:pointer;\" style-active=\"transform:scale(.98)\">جمله‌ی دیگه<\u002Fbutton>\n        <\u002Fdiv>\n        <button onclick=\"{{ jStart }}\" style=\"width:100%;border:none;cursor:pointer;border-radius:16px;padding:18px;background:#6cb33e;color:#fff;font-family:inherit;font-size:20px;font-weight:800;box-shadow:0 10px 22px rgba(108,179,62,.32);\" style-active=\"transform:scale(.98)\" style-hover=\"background:#5aa233\">شروع بازی<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ============ JOMLE PLAY ============ -->\n  <sc-if value=\"{{ showJomlePlay }}\">\n    <section data-screen-label=\"jomle-play -hover=\"background:#5aa233\">ریستارت (جمله‌ی جدید)<\u002Fbutton>\n        <button onclick=\"{{ goHome }}\" style=\"width:100%;border:1.5px solid #cfe3bd;background:#fff;cursor:pointer;border-radius:14px;padding:14px;color:#14100c;font-family:inherit;font-size:16px;font-weight:700;\">صفحه اصلی<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ============ CONNECT ============ -->\n  <sc-if value=\"{{ showConnect }}\">\n    <section data-screen-label=\"connect\" style=\"min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:24px;background:#e9f6f6;\">\n      <div style=\"width:100%;max-width:460px;\">\n        <button onclick=\"{{ goHome }}\" style=\"border:none;background:#fff;color:#7b766e;font-family:inherit;font-size:15px;font-weight:600;padding:9px 16px;border-radius:999px;cursor:pointer;box-shadow:0 2px 8px rgba(20,16,12,.06);\">بازگشت ›<\u002Fbutton>\n        <div style=\"display:flex;align-items:center;gap:12px;margin:22px 0 22px;\">\n          <div style=\"width:50px;height:50px;border-radius:15px;background:#2aa8a8;display:flex;align-items:center;justify-content:center;\">\n            <svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.72\"><\u002Fpath><path d=\"M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.72-1.72\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <div><h1 style=\"font-size:30px;font-weight:900;margin:0;\">کانکت<\u002Fh1><p style=\"margin:0;font-size:15px;color:#1f8a8a;\">۱۰ کلمه بگیر و وصلشون کن<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:10px;margin-bottom:18px;\">\n          <button onclick=\"{{ setConnectNormal }}\" style=\"{{ connectNormalStyle }}\">معمولی<\u002Fbutton>\n          <button onclick=\"{{ setConnectHard }}\" style=\"{{ connectHardStyle }}\">سخت<\u002Fbutton>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ connectLoading }}\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 0;text-align:center;\">\n            <div style=\"width:48px;height:48px;border-radius:50%;border:4px solid #bfe6e6;border-top-color:#2aa8a8;animation:spin .8s linear infinite;\"><\u002Fdiv>\n            <div style=\"margin-top:18px;font-size:16px;color:#1f8a8a;font-weight:600;\">در حال آماده‌سازی کلمات...<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ connectReady }}\">\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px;\">\n            <sc-for list=\"{{ connectWordsList }}\" as=\"item\" hint-placeholder-count=\"10\">\n              <div style=\"background:#fff;border-radius:16px;padding:18px 14px;box-shadow:0 4px 14px rgba(20,16,12,.05);display:flex;align-items:center;gap:12px;\">\n                <span style=\"width:30px;height:30px;flex-shrink:0;border-radius:50%;background:#e0f2f2;color:#1f8a8a;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;\">{{ item.num }}<\u002Fspan>\n                <span style=\"font-size:19px;font-weight:800;color:#14100c;\">{{ item.word }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ connectError }}\"><div style=\"text-align:center;font-size:13px;color:#a8682a;margin-bottom:14px;\">اتصال به اینترنت نبود؛ از کلمه‌های ذخیره‌شده استفاده شد.<\u002Fdiv><\u002Fsc-if>\n          <button onclick=\"{{ connectReshuffle }}\" style=\"width:100%;border:none;cursor:pointer;border-radius:16px;padding:18px;background:#2aa8a8;color:#fff;font-family:inherit;font-size:20px;font-weight:800;box-shadow:0 10px 22px rgba(42,168,168,.32);margin-bottom:12px;\" style-active=\"transform:scale(.98)\" style-hover=\"background:#1f8a8a\">۱۰ کلمه‌ی دیگه<\u002Fbutton>\n          <button o ick=\"{{ fbTeamsDec }}\" style=\"width:42px;height:42px;border-radius:50%;border:none;background:#fbe4ee;color:#14100c;font-size:24px;font-weight:700;cursor:pointer;font-family:inherit;\">−<\u002Fbutton>\n            <span style=\"min-width:30px;text-align:center;font-size:24px;font-weight:900;\">{{ fbTeamsFa }}<\u002Fspan>\n            <button onclick=\"{{ fbTeamsInc }}\" style=\"width:42px;height:42px;border-radius:50%;border:none;background:#d83a78;color:#fff;font-size:24px;font-weight:700;cursor:pointer;font-family:inherit;\">+<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 4px 16px rgba(20,16,12,.05);display:flex;align-items:center;justify-content:space-between;\">\n          <span style=\"font-size:18px;font-weight:700;\">تعداد دور<\u002Fspan>\n          <div style=\"display:flex;align-items:center;gap:14px;\">\n            <button onclick=\"{{ fbRoundsDec }}\" style=\"width:42px;height:42px;border-radius:50%;border:none;background:#fbe4ee;color:#14100c;font-size:24px;font-weight:700;cursor:pointer;font-family:inherit;\">−<\u002Fbutton>\n            <span style=\"min-width:30px;text-align:center;font-size:24px;font-weight:900;\">{{ fbRoundsFa }}<\u002Fspan>\n            <button onclick=\"{{ fbRoundsInc }}\" style=\"width:42px;height:42px;border-radius:50%;border:none;background:#d83a78;color:#fff;font-size:24px;font-weight:700;cursor:pointer;font-family:inherit;\">+<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 4px 16px rgba(20,16,12,.05);\">\n          <div style=\"font-size:18px;font-weight:700;margin-bottom:14px;\">زمان هر دور<\u002Fdiv>\n          <div style=\"display:flex;gap:10px;\">\n            <sc-for list=\"{{ fbTimeOptions }}\" as=\"opt\" hint-placeholder-count=\"3\">\n              <button onclick=\"{{ opt.onClick }}\" style=\"{{ opt.style }}\">{{ opt.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 4px 16px rgba(20,16,12,.05);\">\n          <div style=\"font-size:18px;font-weight:700;margin-bottom:14px;\">سختی<\u002Fdiv>\n          <div style=\"display:flex;gap:10px;\">\n            <sc-for list=\"{{ fbDiffOptions }}\" as=\"opt\" hint-placeholder-count=\"3\">\n              <button onclick=\"{{ opt.onClick }}\" style=\"{{ opt.style }}\"><span style=\"font-size:17px;font-weight:800;\">{{ opt.label }}<\u002Fspan><span style=\"font-size:12px;opacity:.8;font-weight:500;\">{{ opt.sub }}<\u002Fspan><\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fbe4ee;border-radius:16px;padding:16px;margin-bottom:24px;font-size:14px;color:#9c2a57;line-height:1.8;\">فقط با حرف زدن توضیح بده. اشاره، ادا، صدا‌سازی، نوشتن و کشیدن شکل ممنوعه — و نباید خودِ کلمه یا کلمه‌های ممنوعه‌ی روی کارت رو بگی.<\u002Fdiv>\n\n        <button onclick=\"{{ startForbidden }}\" style=\"width:100%;border:none;cursor:pointer;border-radius:16px;padding:18px;background:#d83a78;color:#fff;font-family:inherit;font-size:20px;font-weight:800;box-shadow:0 10px 22px rgba(216,58,120,.3);\" style-active=\"transform:scale(.98)\" style-hover=\"background:#c02e68\">شروع بازی<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <!-- ============ FORBIDDEN GAME ============ -->\n  <sc-if value=\"{{ showFbGame }}\">\n    <section data-screen-label=\"forbidden-game\" style=\"min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:18px;background:#fdeef5;\">\n      <div style=\"width:100%;max-width:460px;display:flex;flex-direction:column;flex:1;\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;\">\n          <span style=\"font-size:14px;font-weight:700;color:#b02f63;background:#fff;padding:6px 14px;border-radius:999px;\">{{ fbRoundLabel }}<\u002Fspan>\n          <button onclick=\"{{ goHome }}\" style=\"border:none;background:transparent;color:#b02f63;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;\">خروج<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;\">\n          <sc-for list=\"{{ fbScoreChips }}\" as=\"chip\" hint-placeholder-count=\"2\">\n            <div style=\"{{ chip.style }}\"><span style=\"font-size:13px;font-weight:600;opacity:.85;\">{{ chip.label }}<\u002Fspan><span style=\"font-size:20px;font-weight:900;\">{{ chip.score }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <!-- intro -->\n        <sc-if value=\"{{ fbPhaseIntro }}\">\n          <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:slideUp .35s ease both;\">\n            <div style=\"font-size:16px;color:#b02f63;margin-bottom:8px;\">نوبتِ<\u002Fdiv>\n            <div style=\"font-size:46px;font-weight:900;color:#d83a78;margin-bottom:18px;\">{{ fbTurnTeamLabel }}<\u002Fdiv>\n            <p style=\"font-size:17px;color:#7b766e;max-width:320px;margin:0 0 28px;\">یک نفر توضیح‌دهنده بشه، بقیه‌ی تیم حدس بزنن. فقط حرف بزن — اشاره و ادا ممنوع!<\u002Fp>\n            <button onclick=\"{{ fbBegin }}\" style=\"border:none;cursor:pointer;border-radius:16px;padding:18px 40px;background:#d83a78;color:#fff;font-family:inherit;font-size:20px;font-weight:800;box-shadow:0 10px 22px rgba(216,58,120,.32);\" style-active=\"transform:scale(.98)\">شروع راند<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- playing -->\n        <sc-if value=\"{{ fbPhasePlaying }}\">\n          <div style=\"flex:1;display:flex;flex-direction:column;\">\n            <div style=\"display:flex;align-items:center;gap:16px;margin-bottom:14px;\">\n              <div style=\"{{ fbTimerStyle }}\">\n                <div style=\"width:104px;height:104px;border-radius:50%;background:#fdeef5;display:flex;flex-direction:column;align-items:center;justify-content:center;\">\n                  <div style=\"font-size:38px;font-weight:900;color:#14100c;line-height:1;font-variant-numeric:tabular-nums;\">{{ fbRemainingLabel }}<\u002Fdiv>\n                  <div style=\"font-size:11px;color:#b02f63;\">ثانیه<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;display:flex;flex-direction:column;gap:10px;\">\n                <div style=\"background:#e7f3ea;border-radius:14px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;\"><span style=\"font-size:15px;font-weight:700;color:#2f8a3e;\">درست<\u002Fspan><span style=\"font-size:24px;font-weight:900;color:#2f8a3e;\">{{ fbCorrectFa }}<\u002Fspan><\u002Fdiv>\n                <div style=\"background:#fde9e8;border-radius:14px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;\"><span style=\"font-size:15px;font-weight:700;color:#c92216;\">خطا<\u002Fspan><span style=\"font-size:24px;font-weight:900;color:#c92216;\">{{ fbWrongFa }}<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff;border-radius:20px;padding:22px;box-shadow:0 8px 24px rgba(20,16,12,.08);margin-bottom:16px;flex:1;display:flex;flex-direction:column;justify-content:center;\">\n              <div style=\"text-align:center;font-size:13px;font-weight:700;color:#b02f63;background:#fdeef5;align-self:center;padding:4px 14px;border-radius:999px;margin-bottom:14px;\">{{ fbCategory }}<\u002Fdiv>\n              <div style=\"text-align:center;font-size:40px;font-weight:900;color:#14100c;margin-bottom:18px;\">{{ fbCardWord }}<\u002Fdiv>\n              <div style=\"text-align:center;font-size:13px;font-weight:700;color:#c92216;margin-bottom:10px;\">نگو:<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px;justify-content:center;\">\n                <sc-for list=\"{{ fbForbiddenList }}\" as=\"item\" hint-placeholder-count=\"5\">\n                  <span style=\"background:#fde9e8;color:#c92216;font-size:16px;font-weight:700;padding:8px 16px;border-radius:999px;\">{{ item.w }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-if value=\"{{ fbShowHint }}\">\n                <div style=\"margin-top:16px;text-align:center;font-size:14px;color:#7b766e;background:#f5f3ee;border-radius:12px;padding:10px 14px;\">راهنما: {{ fbHint }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <button onclick=\"{{ fbHit }}\" style=\"width:100%;border:none;cursor:pointer;border-radius:16px;padding:18px;background:#6cb33e;color:#fff;font-family:inherit;font-size:21px;font-weight:900;box-shadow:0 8px 18px rgba(108,179,62,.32);margin-bottom:10px;\" style-active=\"transform:scale(.98)\">✓ درست<\u002Fbutton>\n            <div style=\"display:flex;gap:10px;\">\n              <button onclick=\"{{ fbTaboo }}\" style=\"flex:1;border:none;cursor:pointer;border-radius:16px;padding:16px;background:#ed2923;color:#fff;font-family:inherit;font-size:17px;font-weight:800;box-shadow:0 8px 18px rgba(237,41,35,.28);\" style-active=\"transform:scale(.98)\">✕ کلمه ممنوعه<\u002Fbutton>\n              <button onclick=\"{{ fbSkip }}\" style=\"flex:0 0 38%;border:1.5px solid #f0c9d9;background:#fff;cursor:pointer;border-radius:16px;padding:16px;color:#b02f63;font-family:inherit;font-size:17px;font-weight:800;\" style-active=\"transform:scale(.98)\">رد کردن<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- summary -->\n        <sc-if value=\"{{ fbPhaseSummary }}\">\n          <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:popIn .4 "width:100%;max-width:460px;position:relative;z-index:6;\">\n        <div style=\"text-align:center;margin-bottom:24px;animation:popIn .5s cubic-bezier(.22,1,.36,1) both;\">\n          <div style=\"font-size:16px;color:#b02f63;\">نتیجه‌ی بازی<\u002Fdiv>\n          <div style=\"font-size:38px;font-weight:900;color:#d83a78;margin-top:6px;\">{{ fbWinnerLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border-radius:20px;padding:12px;box-shadow:0 12px 30px rgba(20,16,12,.1);margin-bottom:24px;\">\n          <sc-for list=\"{{ fbResultRows }}\" as=\"row\" hint-placeholder-count=\"2\">\n            <div style=\"{{ row.style }}\">\n              <div style=\"display:flex;align-items:center;gap:12px;\">\n                <span style=\"{{ row.medalStyle }}\">{{ row.rankFa }}<\u002Fspan>\n                <span style=\"font-size:19px;font-weight:800;\">{{ row.team }}<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"font-size:24px;font-weight:900;color:#d83a78;\">{{ row.score }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button onclick=\"{{ fbRestart }}\" style=\"width:100%;border:none;cursor:pointer;border-radius:16px;padding:18px;background:#d83a78;color:#fff;font-family:inherit;font-size:20px;font-weight:800;box-shadow:0 10px 22px rgba(216,58,120,.3);margin-bottom:12px;\" style-active=\"transform:scale(.98)\">مسابقه جدید<\u002Fbutton>\n        <div style=\"display:flex;gap:12px;\">\n          <button onclick=\"{{ openFbSetup }}\" style=\"flex:1;border:1.5px solid #f0c9d9;background:#fff;cursor:pointer;border-radius:14px;padding:14px;color:#14100c;font-family:inherit;font-size:16px;font-weight:700;\">تغییر تنظیمات<\u002Fbutton>\n          <button onclick=\"{{ goHome }}\" style=\"flex:1;border:1.5px solid #f0c9d9;background:#fff;cursor:pointer;border-radius:14px;padding:14px;color:#14100c;font-family:inherit;font-size:16px;font-weight:700;\">صفحه اصلی<\u002Fbutton>\n        <\u002F
